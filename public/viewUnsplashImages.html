<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>Unsplash: Find your Picture</title>
    <style>
        body {
            margin: 0;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(226, 226, 226);
            min-height: 100vh;
        }

        .page-section {
            margin: 10px;
        }

        #query {
            padding: 4px;
            margin-right: 15px;
        }

        .page-button {
            width: 100px;
            background-color: white;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.5s ease-in, box-shadow 0.5s ease-in;
        }

        .page-button:hover {
            background-color: rgb(184, 219, 254);
            box-shadow: 0px 4px 8px 0px rgba(0, 0, 0, 0.2);
        }

        #page-indicator {
            margin: 0 10px;
        }

        #results {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        #results img {
            height: auto;
            cursor: pointer;
            margin: 2px;
            width: 250px;
            object-fit: contain;
        }

        .loading-img {
            filter: blur(5px);
            opacity: 0.6;
            transition: all 0.3s ease-in-out;
        }

        .photo-container {
            display: flex;
            padding: 10px 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid gray;
            gap: 5px;
            margin: 10px;
        }

        .id-label {
            font-size: 12px;
            margin-top: 4px;
            color: gray;
        }

        .save-button {
            border: none;
            cursor: pointer;
            background-color: rgb(184, 219, 254);
            padding: 2px;
            border-radius: 3px;
            transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
        }

        .save-button:hover {
            background-color: rgb(0, 126, 253);
            color: white;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <h1>Unsplash: View And Add Images To The Database</h1>
        <div class="page-section">
            <input type="text" id="query" placeholder="Search term (e.g. Lisbon)">
            <button id="searchBtn" class="page-button" onclick="search(true)">Search</button>
        </div>

        <div class="page-section">
            <span>API calls (estimated): <strong id="request-count">1</strong> / 50</span>
        </div>

        <div id="results"></div>

        <div class="page-section">
            <button class="page-button" id="prevBtn" onclick="prevPage()">
                🢦 Previous</button>
            <span id="page-indicator">Page 1</span>
            <button class="page-button" id="nextBtn" onclick="nextPage()">
                Next 🢧</button>
        </div>
    </div>
    <script>
        let currentPage;
        let requestCount;
        let currentQuery = "";
        const cache = new Map();  // Used to avoid duplicate API requests within a session

        // Attempt to restore previous state from localStorage (valid for 1 hour)
        const savedState = JSON.parse(localStorage.getItem("unsplashState"));
        if (savedState && Date.now() - savedState.timestamp < 60 * 60 * 1000) {
            currentPage = savedState.page || 1;
            requestCount = savedState.requestCount || 0;
        } else {
            currentPage = 1;
            requestCount = 0;
            localStorage.removeItem("unsplashState");  // Clean up expired state
        }

        // Immediately reflect the restored request count in the UI
        document.getElementById("request-count").textContent = requestCount;


        /**
   * Performs an image search using the Unsplash API.
   * Handles paging, result rendering, caching, and API rate tracking.
   * @param {boolean} reset - Whether to reset pagination and query state
   */
        async function search(reset = false) {
            const queryInput = document.getElementById("query").value.trim();

            // If starting a new search or no previous query exists
            if (reset || currentQuery === "") {
                currentQuery = queryInput;
                currentPage = 1;
            }

            const cacheKey = `${currentQuery}-${currentPage}`;
            const resultsDiv = document.getElementById("results");
            const pageIndicator = document.getElementById("page-indicator");
            const searchBtn = document.getElementById("searchBtn");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            resultsDiv.innerHTML = "Loading Pictures...";
            searchBtn.classList.add("loading");
            prevBtn.disabled = true;
            nextBtn.disabled = true;

            let data;

            // Use cached results if available
            if (cache.has(cacheKey)) {
                data = cache.get(cacheKey);
            } else {
                // Make actual API call if no cache hit
                const url = `http://localhost:3000/api/unsplash/search?query=${currentQuery}&page=${currentPage}`;
                const res = await fetch(url);
                data = await res.json();
                cache.set(cacheKey, data);
                requestCount++;
                document.getElementById("request-count").textContent = requestCount;
            }

            // Render results
            resultsDiv.innerHTML = "";
            pageIndicator.textContent = `Page ${currentPage}`;

            /**
      * Saves a selected Unsplash image to the database via your API.
      * @param {string} photoId - Unsplash photo ID
      * @param {string} destinationName - Name of the destination
      * @param {"horizontal"|"vertical"} orientation - Image layout
      */
            async function saveImage(photoId, destinationName, orientation) {
                await fetch("http://localhost:3000/api/unsplash/save-image", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        photoId,
                        destinationName,
                        orientation // "horizontal" or "vertical"
                    })
                });
            }

            // Render each photo result with clickable image and save buttons
            data.results.forEach(photo => {
                const container = document.createElement("div");
                container.classList.add("photo-container");
                const creditText = `By ${photo.user.name}`;

                const img = document.createElement("img");
                img.src = photo.urls.regular;
                img.loading = "lazy";
                img.classList.add("loading-img");
                img.onload = () => {
                    img.classList.remove("loading-img");
                };
                img.onclick = () => {
                    const idLabel = document.createElement("div");
                    idLabel.textContent = `ID: ${photo.id}`;
                    idLabel.classList.add("id-label");

                    const existing = container.querySelector(".id-label");
                    if (existing) existing.remove();

                    container.appendChild(idLabel);
                };

                // Horizontal save button
                const btnHorizontal = document.createElement("button");
                btnHorizontal.textContent = "Save as Horizontal |";
                btnHorizontal.classList.add("save-button")
                btnHorizontal.onclick = async () => {
                    await saveImage(photo.id, currentQuery, "horizontal");
                    alert("Als horizontal gespeichert.");
                };

                // Vertical save button
                const btnVertical = document.createElement("button");
                btnVertical.classList.add("save-button")
                btnVertical.textContent = "Save as Vertical  __";
                btnVertical.onclick = async () => {
                    await saveImage(photo.id, currentQuery, "vertical");
                    alert("Als vertikal gespeichert.");
                };

                container.appendChild(document.createTextNode(creditText));
                container.appendChild(img);
                container.appendChild(btnHorizontal);
                container.appendChild(btnVertical);
                resultsDiv.appendChild(container);
            });

            searchBtn.classList.remove("loading");
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = false;

            // Persist current state in localStorage (updated with new timestamp)
            localStorage.setItem("unsplashState", JSON.stringify({
                page: currentPage,
                requestCount: requestCount,
                timestamp: Date.now()
            }));
        }

        /**
 * Go to the next page of Unsplash results
 */
        function nextPage() {
            currentPage++;
            search();
        }

        /**
   * Go to the previous page (if not already at page 1)
   */
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                search();
            }
        }

    </script>
</body>

</html>
